        body { margin: 0; padding: 0; }
        #map { height: 100vh; width: 100%; }
        .city-popup { font-family: Arial, sans-serif; }
        .city-popup h3 { margin: 0 0 10px 0; color: #2c3e50; font-size: 16px; }
        .city-popup p { margin: 5px 0; font-size: 14px; }

</head>
